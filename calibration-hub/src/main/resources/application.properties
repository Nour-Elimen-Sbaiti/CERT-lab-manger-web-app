spring.application.name=calibration-hub

# Port de l'application Spring Boot
server.port=8081
app.base-url=http://localhost:8081
# URL du frontend (Vite dev server) vers laquelle rediriger apres verification d'email
app.frontend-url=http://localhost:5173

# --- Connexion base de données PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/calibration_hub_db
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

